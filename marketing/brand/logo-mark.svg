<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="HConcierge">
  <title>HConcierge</title>
  <!-- Geometric, not typeset: the mark has to survive a favicon, an app icon
       and a video end-card without shipping a font with it. -->
  <rect width="64" height="64" rx="15" fill="#1c1917"/>
  <!-- The two uprights of an H. -->
  <rect x="17" y="18" width="6.5" height="28" rx="3.25" fill="#faf8f5"/>
  <rect x="40.5" y="18" width="6.5" height="28" rx="3.25" fill="#faf8f5"/>
  <!-- The crossbar is a target-time track: the filled part is the time spent.
       It is the one idea the product is actually about, drawn at 16px. -->
  <rect x="23.5" y="29" width="17" height="6" fill="#faf8f5" opacity="0.45"/>
  <rect x="23.5" y="29" width="10.5" height="6" fill="#faf8f5"/>
</svg>
